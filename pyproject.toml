[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kinveil"
version = "0.1.0"
description = "A local-first, face-aware AI assistant for shared spaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "numpy>=1.26,<3",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
face = [
  "insightface>=0.7.3,<1",
  "onnxruntime>=1.18,<2",
  "opencv-python>=4.10,<5",
]
voice = [
  "onnxruntime>=1.18,<2",
  "sherpa-onnx>=1.10.28,<2",
  "sounddevice>=0.5,<1",
]
separation = [
  "speechbrain>=1.0,<2",
  "torch>=2.2,<3",
  "torchaudio>=2.2,<3",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
kinveil = "kinveil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kinveil"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
